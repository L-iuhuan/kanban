<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>看板流水线</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 自定义标题栏 -->
    <div class="titlebar" data-tauri-drag-region>
      <div class="titlebar-brand">
        <span class="logo">📊</span>
        <span class="app-title">看板流水线</span>
        <span class="badge" id="version-badge" title="代码版本">—</span>
        <span class="status" id="net-status" title="连接状态"><i class="dot"></i><span id="net-text">检测中</span></span>
      </div>
      <div class="titlebar-right">
        <button id="btn-settings" class="tb-btn" title="设置">⚙</button>
        <div class="win-controls">
          <button id="btn-min" class="tb-btn" title="最小化">&#x2013;</button>
          <button id="btn-max" class="tb-btn" title="最大化/还原">&#x25A1;</button>
          <button id="btn-close" class="tb-btn tb-close" title="关闭">&#x2715;</button>
        </div>
      </div>
    </div>

    <main class="content">
      <!-- 错误横幅 -->
      <div class="banner" id="error-banner" hidden>
        <span class="banner-icon">⚠️</span>
        <span id="banner-text"></span>
        <button id="banner-copy" class="banner-btn">复制日志</button>
        <button id="banner-close" class="banner-btn ghost">×</button>
      </div>

      <!-- 上半区:拖拽 + 阶段 -->
      <section class="top-row">
        <!-- Excel 拖拽区 -->
        <div class="card drop-card" id="drop-zone">
          <div class="drop-inner">
            <div class="drop-icon">📥</div>
            <div class="drop-title">把 Excel 拖到这里</div>
            <div class="drop-sub">或点击选择文件</div>
            <div class="drop-file" id="data-file" hidden></div>
            <label class="checkbox-row">
              <input type="checkbox" id="opt-skip" />
              <span>跳过数据处理(数据没变,只重新生成看板)</span>
            </label>
          </div>
        </div>

        <!-- 阶段进度 -->
        <div class="card stage-card">
          <div class="stage-title">流程阶段</div>
          <ol class="stepper" id="stepper">
            <li data-stage="0"><span class="s-idx">1</span><span class="s-name">同步代码</span></li>
            <li data-stage="1"><span class="s-idx">2</span><span class="s-name">环境检查</span></li>
            <li data-stage="2"><span class="s-idx">3</span><span class="s-name">数据处理</span></li>
            <li data-stage="3"><span class="s-idx">4</span><span class="s-name">生成看板</span></li>
            <li data-stage="4"><span class="s-idx">5</span><span class="s-name">完成</span></li>
          </ol>
          <div class="progress">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="stage-detail" id="stage-detail">等待开始</div>
        </div>
      </section>

      <!-- 日志面板 -->
      <section class="card log-card">
        <div class="log-header">
          <span>运行日志</span>
          <div class="log-actions">
            <button id="btn-copy-log" class="mini-btn" title="复制全部日志">⧉ 复制</button>
            <button id="btn-clear-log" class="mini-btn" title="清空">清空</button>
          </div>
        </div>
        <div class="log-body" id="log-body">
          <div class="log-empty">日志将在这里实时显示</div>
        </div>
      </section>

      <!-- 底部操作行 -->
      <section class="actions">
        <button id="btn-run" class="btn primary big">▶ 生成看板</button>
        <button id="btn-stop" class="btn danger big" disabled>■ 停止</button>
        <div class="actions-sep"></div>
        <button id="btn-open-dashboard" class="btn" disabled>📊 打开看板</button>
        <div class="folder-group">
          <span class="folder-label">中间产物</span>
          <button id="btn-open-silver" class="btn ghost" disabled title="清洗后明细(silver)">银层</button>
          <button id="btn-open-gold" class="btn ghost" disabled title="汇总指标(gold)">金层</button>
          <button id="btn-open-report" class="btn ghost" disabled title="产品生命周期报告">报告</button>
        </div>
        <button id="btn-open-output" class="btn ghost" disabled>📁 输出目录</button>
      </section>

      <footer class="footer" id="footer">看板流水线运行器 · 由 Rust + WebView2 驱动</footer>
    </main>

    <!-- 设置弹层 -->
    <div class="modal-mask" id="settings-modal" hidden>
      <div class="modal">
        <h3>⚙ 设置</h3>
        <label class="field">
          <span>共享盘代码目录(UNC 或本地路径)</span>
          <input type="text" id="share-path-input" placeholder="例:\\server\share\kanban-repo 或 D:\kanban-share" />
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="opt-auto-sync" checked />
          <span>启动时自动同步代码</span>
        </label>
        <div class="modal-actions">
          <button id="btn-save-config" class="btn primary">保存并同步</button>
          <button id="btn-cancel-config" class="btn ghost">取消</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
